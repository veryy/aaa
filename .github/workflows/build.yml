name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee /tmp/build-output || { echo "::error::$(tail -50 /tmp/build-output | sed ":a;N;\$!ba;s/\n/%0A/g")"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: OnePlus-AutoInstaller-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to build branch
        shell: bash
        run: |
          trap 'echo "::error::publish failed at line $LINENO"' ERR
          set -x
          cp app/build/outputs/apk/debug/*.apk /tmp/OnePlus-AutoInstaller.apk
          git config user.name 'github-actions[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan built-apk
          git rm -rf . >/dev/null
          cp /tmp/OnePlus-AutoInstaller.apk ./OnePlus-AutoInstaller.apk
          git add OnePlus-AutoInstaller.apk
          git commit -m 'Publish debug APK'
          git push --force origin built-apk
